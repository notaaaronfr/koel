[project]
name = "koel"
version = "0.1.0"
description = "Open trust checker for cancer mutation scores (research use only)"
authors = [
    { name = "notaaaronfr", email = "charlesaarondavid@gmail.com" }
]
readme = "README.md"
license = "MIT"
keywords = ["cancer", "genomics", "variant interpretation", "oncogenicity", "AlphaMissense", "calibration"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[project.urls]
Repository = "https://github.com/notaaaronfr/koel"
Issues = "https://github.com/notaaaronfr/koel/issues"

[project.scripts]
koel = "koel.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
figures = [
    "matplotlib>=3.11.2",
]

[project]
name = "koel"
version = "0.1.0"
description = "Open trust checker for cancer mutation scores (research use only)"
authors = [
    { name = "notaaaronfr", email = "charlesaarondavid@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
koel = "koel.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
